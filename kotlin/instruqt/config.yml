version: "3"
containers:
- name: workshop
  # Pinned by digest, not :latest. A moving tag let a sandbox boot a cached
  # older image that had no code-server in it, so the editor tabs showed
  # "Please wait" forever. Re-pin this after every image rebuild with:
  #   docker buildx imagetools inspect ghcr.io/nadvolod/edu-nexus-kotlin-sandbox:latest --format "{{.Manifest.Digest}}"
  image: ghcr.io/nadvolod/edu-nexus-kotlin-sandbox@sha256:ca06525af12e6485ff292ed2c57ad46a0333b2ee976fc4e55988f28280f5a873
  shell: /bin/bash
  # Two JVM Workers, a Gradle daemon, a dev server, and two code-server instances.
  memory: 6144
  # Every port a challenge tab points at MUST be listed here. Instruqt's proxy
  # cannot reach an undeclared port, and the tab just shows "Please wait"
  # forever. This was the actual cause of the editor tabs failing; it is not a
  # code-server problem.
  ports:
  - 8233   # Temporal UI
  - 8443   # Editor, exercise tree (code-server)
  - 8444   # Editor, solution tree (code-server)
